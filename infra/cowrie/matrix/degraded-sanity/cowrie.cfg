# Degradation matrix -- the DEGRADED SANITY arm.
#
# A honeypot that answers everything and contradicts itself twice. It exists
# to show that the evaluation separates "did the decoy respond" from "do its
# responses agree", because those are different questions and only one of
# them moves the numeric score.
#
# Two deliberate contradictions, one per fact:
#
#   * os.identity -- honeyfs/usr/lib/os-release declares Ubuntu while the
#     image's kernel string still says Debian. The overlay sits at the
#     symlink TARGET, because /etc/os-release is a link in the pickled
#     filesystem and Cowrie silently skips non-file nodes when attaching
#     honeyfs content -- see the hardened arm's cfg for the full note.
#     Both probes answer, so both facts are
#     observed and the sanity SCORE is a perfect 3/3; the disagreement shows
#     up only as a contradiction finding. That is the point of the arm.
#   * host.name -- `hostname` reports the value below and
#     honeyfs/etc/hostname reports something else, the same defect stock has
#     by accident, kept here on purpose.
#
# Note what this arm is NOT: it is not "stock plus noise". Stock already
# contradicts itself once, on host.name, because its /etc/hostname holds the
# image default. This arm adds the second contradiction and leaves everything
# else identical.

[honeypot]
hostname = med-ws-04
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
ttylog = false
contents_path = /honeyfs

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = false

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0
