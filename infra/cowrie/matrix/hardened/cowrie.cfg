# Degradation matrix -- the HARDENED arm.
#
# Identical to infra/cowrie/cowrie.cfg except for `contents_path`, which
# overlays the files in this arm's honeyfs/ onto the image's pickled
# filesystem. Two defects the stock honeypot really has are fixed here:
#
#   * /etc/os-release is empty on stock, so `cat` returns nothing and
#     `os.identity` records not_observed. Populated here, and populated with
#     the SAME distribution the kernel string names, so the two agree.
#
#     Note the overlay lives at honeyfs/usr/lib/os-release, NOT
#     honeyfs/etc/os-release. In the image's pickled filesystem /etc/os-release
#     is a symlink to usr/lib/os-release, exactly as on real Debian, and
#     Cowrie's `init_honeyfs` only attaches real content to nodes of type
#     T_FILE -- a symlink is skipped in silence. An overlay written at the
#     /etc path is simply ignored, with no error and no log line, and the
#     probe keeps reporting an empty file. That is also WHY stock's
#     /etc/os-release is empty: the link resolves to a node the image ships
#     with no contents behind it. Overlay the target, never the link.
#   * `hostname` reports the value below while stock's /etc/hostname still
#     holds the image default `svr04`. Matched here, so host.name stops
#     contradicting itself.
#
# Everything else is held constant on purpose: this arm differs from stock in
# exactly these two respects, which is what makes a score delta attributable.

[honeypot]
hostname = med-ws-04
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
ttylog = false
contents_path = /honeyfs

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = false

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0
