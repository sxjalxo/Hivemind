# Degradation matrix -- the DEGRADED FILESYSTEM arm.
#
# Stock, with two filesystem facts hollowed out. honeyfs/etc/passwd and
# honeyfs/proc/cpuinfo are present but EMPTY, so `cat` on either runs cleanly
# and prints nothing: exit 0 with no output, which `run_probes` records as
# not_observed -- a genuine absence rather than a probe we failed to run.
#
# This is the arm that moves the numeric score. `file_system` has three
# probes; two of them stop observing anything, so the characteristic falls
# from 3/3 to 1/3 while every other characteristic holds still. Paired with
# the degraded-sanity arm, which moves findings without moving its score,
# the two show the evaluation separating on both axes independently.
#
# Nothing else is overlaid on purpose. This arm inherits stock's empty
# /etc/os-release and stock's `svr04` hostname, so it differs from stock in
# the filesystem facts and in nothing else.

[honeypot]
hostname = med-ws-04
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
ttylog = false
contents_path = /honeyfs

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = false

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0
