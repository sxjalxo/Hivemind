# Hivemind LIVE honeypot (GCP e2-micro, honeypot.id gcp-wild-01).
#
# Same identity as the local cowrie-01 (infra/cowrie/cowrie.cfg) with the
# hardened arm's filesystem fixes (infra/cowrie/matrix/hardened): /etc/hostname,
# /etc/hosts and /usr/lib/os-release agree with the hostname below.
#
# This one faces the internet, so forwarding is LOGGED but never performed:
# `forwarding = true` records direct-tcpip requests (the "tunnel" timeline
# kind), while redirect and tunnel stay off so the VM cannot be used as a proxy.
# Outbound traffic is also denied at the GCP firewall, so an attacker's
# wget/curl is recorded with its URL but fetches nothing.

[honeypot]
hostname = med-ws-04
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
ttylog = true
ttylog_path = var/lib/cowrie/tty
contents_path = /honeyfs
# Bytes one transfer may store: SFTP, scp/exec stdin, telnet, wget/curl/tftp.
# Unset means unlimited, and an attacker could upload until the 10 GB disk is
# full. guard.sh's disk floor is the backstop for many uploads under the cap.
download_limit_size = 10485760

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

[output_textlog]
enabled = false

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
forwarding = true
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0
