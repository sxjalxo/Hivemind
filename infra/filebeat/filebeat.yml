# One input per honeypot, each stamping its OWN honeypot.id.
#
# `honeypot.id` is not cosmetic and is not only for the inventory screen.
# `list_honeypots` derives the inventory by aggregating events on this field
# -- a honeypot exists because its events do -- and, more consequentially,
# chain verification reads the executed commands back out of Elasticsearch
# filtered by honeypot id. An arm whose log never arrives under its own id
# cannot have a single chain verified, and `attack_possibilities` is left
# unestablished for it. So an arm without its own input here is an arm that
# can only ever be compared on five of the six characteristics.
#
# The matrix inputs below point at volumes that only carry data while the
# `matrix` compose profile is up. A filestream input whose path does not
# exist simply finds nothing, so these are inert on a default stack.
filebeat.inputs:
  - type: filestream
    id: cowrie-json
    enabled: true
    paths:
      - /cowrie-logs/cowrie.json
    parsers:
      - ndjson:
          target: cowrie
          overwrite_keys: true
          add_error_key: true
    processors:
      - add_fields:
          target: honeypot
          fields:
            id: cowrie-01
            name: Cowrie SSH (med-ws-04)

  - type: filestream
    id: cowrie-json-hardened
    enabled: true
    paths:
      - /cowrie-logs-hardened/cowrie.json
    parsers:
      - ndjson:
          target: cowrie
          overwrite_keys: true
          add_error_key: true
    processors:
      - add_fields:
          target: honeypot
          fields:
            id: matrix-hardened
            name: Matrix arm - hardened

  - type: filestream
    id: cowrie-json-degraded-sanity
    enabled: true
    paths:
      - /cowrie-logs-degraded-sanity/cowrie.json
    parsers:
      - ndjson:
          target: cowrie
          overwrite_keys: true
          add_error_key: true
    processors:
      - add_fields:
          target: honeypot
          fields:
            id: matrix-degraded-sanity
            name: Matrix arm - degraded sanity

  - type: filestream
    id: cowrie-json-degraded-fs
    enabled: true
    paths:
      - /cowrie-logs-degraded-fs/cowrie.json
    parsers:
      - ndjson:
          target: cowrie
          overwrite_keys: true
          add_error_key: true
    processors:
      - add_fields:
          target: honeypot
          fields:
            id: matrix-degraded-fs
            name: Matrix arm - degraded filesystem

  # The HTTP honeypot (infra/webpot). It writes Cowrie-shaped lines, so it is
  # parsed into the same `cowrie` namespace and goes through the same pipeline;
  # the namespace name is historical, not a claim that this is Cowrie.
  - type: filestream
    id: webpot-json
    enabled: true
    paths:
      - /webpot-logs/webpot.json
    parsers:
      - ndjson:
          target: cowrie
          overwrite_keys: true
          add_error_key: true
    processors:
      - add_fields:
          target: honeypot
          fields:
            id: web-01
            name: Web HTTP (staff portal)

# Cowrie's JSON is parsed into the nested "cowrie" namespace above (rather than
# the document root) because Filebeat's own filestream input always attaches a
# root-level "input" field (input.type: filestream). Cowrie's raw JSON also has
# a root-level "input" field (the typed command) for cowrie.command.input
# events, and the two collide under the same key: Filebeat's own value wins,
# silently discarding the command text before it ever reaches Elasticsearch.
# Parsing into "cowrie.*" avoids the collision entirely.
#
# Field policy (which Cowrie fields survive, which are noise, which are
# genuinely unexpected) lives in ONE place: infra/elasticsearch/pipelines/
# cowrie-ecs.json. That pipeline flattens the "cowrie" namespace back onto the
# document root, renames the fields it cares about, and removes known noise.
# Anything left over is neither promoted nor removed, so Elasticsearch's
# dynamic:strict mapping rejects it BY NAME — a loud, visible
# strict_dynamic_mapping_exception in the Filebeat log naming the offending
# field. Filebeat itself only drops fields that are unambiguously its own
# metadata (agent/ecs/host/input/log/@metadata.beat) and never touches the
# "cowrie" object's contents, so an unrecognised Cowrie field can never be
# silently discarded before Elasticsearch gets a chance to flag it.
# Global processors. `honeypot.id` deliberately does NOT live here any more:
# it is per-input above, because each matrix arm must stamp its own.
processors:
  - drop_fields:
      fields: ["agent", "ecs", "host", "input", "log", "@metadata.beat"]
      ignore_missing: true
  - add_fields:
      target: labels
      fields:
        seeded: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "honeypot-events"
  # No `pipeline:` here, deliberately. Every `honeypot-events*` index gets
  # `index.default_pipeline: cowrie-ecs` from the template, so normal events are
  # processed exactly as before. Naming the pipeline on the OUTPUT also applied
  # it to dead-lettered events below, and cowrie-ecs removes `message` -- which
  # is where Filebeat puts the rejected original -- so the dead letter kept the
  # reason and lost the event. Measured on 8.15.3, not assumed.
  # An event Elasticsearch REJECTS -- a Cowrie field the strict mapping does
  # not know, which real internet traffic produces sooner or later -- is
  # DROPPED by default (`non_indexable_policy: drop`), visible only as a line
  # in this container's log. Dropped means lost: there is no replay. This keeps
  # it instead, with Elasticsearch's reason, in an index outside the
  # `honeypot-events*` pattern so neither the strict template nor the
  # cowrie-ecs default pipeline applies to it. The backend's status page
  # counts it, so a rejection is visible on the dashboard rather than only
  # here. Fix the mapping, then the original event is in `message` to replay.
  non_indexable_policy.dead_letter_index:
    index: "hivemind-rejected-events"

setup.template.enabled: false
setup.ilm.enabled: false
