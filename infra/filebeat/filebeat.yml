filebeat.inputs:
  - type: filestream
    id: cowrie-json
    enabled: true
    paths:
      - /cowrie-logs/cowrie.json
    parsers:
      - ndjson:
          target: cowrie
          overwrite_keys: true
          add_error_key: true

# Cowrie's JSON is parsed into the nested "cowrie" namespace above (rather than
# the document root) because Filebeat's own filestream input always attaches a
# root-level "input" field (input.type: filestream). Cowrie's raw JSON also has
# a root-level "input" field (the typed command) for cowrie.command.input
# events, and the two collide under the same key: Filebeat's own value wins,
# silently discarding the command text before it ever reaches Elasticsearch.
# Parsing into "cowrie.*" avoids the collision entirely.
#
# Field policy (which Cowrie fields survive, which are noise, which are
# genuinely unexpected) lives in ONE place: infra/elasticsearch/pipelines/
# cowrie-ecs.json. That pipeline flattens the "cowrie" namespace back onto the
# document root, renames the fields it cares about, and removes known noise.
# Anything left over is neither promoted nor removed, so Elasticsearch's
# dynamic:strict mapping rejects it BY NAME — a loud, visible
# strict_dynamic_mapping_exception in the Filebeat log naming the offending
# field. Filebeat itself only drops fields that are unambiguously its own
# metadata (agent/ecs/host/input/log/@metadata.beat) and never touches the
# "cowrie" object's contents, so an unrecognised Cowrie field can never be
# silently discarded before Elasticsearch gets a chance to flag it.
processors:
  - drop_fields:
      fields: ["agent", "ecs", "host", "input", "log", "@metadata.beat"]
      ignore_missing: true
  - add_fields:
      target: honeypot
      fields:
        id: cowrie-01
        name: Cowrie SSH (med-ws-04)
  - add_fields:
      target: labels
      fields:
        seeded: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "honeypot-events"
  pipeline: "cowrie-ecs"

setup.template.enabled: false
setup.ilm.enabled: false
