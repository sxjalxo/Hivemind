version: "3"

# How a probe's claim about `os.identity` is read out of its raw output.
#
# Anchored and shared rather than written twice, because the two probes below
# MUST read the fact the same way: `uname -a` prints a kernel string and
# `cat /etc/os-release` prints key=value lines, so their raw outputs can never
# be equal even when both correctly describe the same distribution. Comparing
# them raw reported a working honeypot as contradicting itself. `load_probes`
# refuses a probe set where two probes for one fact disagree about declaring an
# extract; the anchor makes them agree on the pattern as well.
#
# The group is the distribution name, matched case-insensitively and
# lower-cased before comparison, so "Debian" from a kernel string and
# "Debian GNU/Linux 12 (bookworm)" from an os-release both reduce to `debian`.
_os_distro: &os_distro '\b(debian|ubuntu|centos|fedora|alpine|arch|red\s*hat|rhel|suse|gentoo)\b'

# How a probe's claim about `host.name` is read: a bare hostname (what
# `hostname` and `/etc/hostname` print), or the name on /etc/hosts' 127.0.1.1
# line, which is where Debian puts the machine's own name. Added in version 3
# with the `hosts_file` probe: stock Cowrie's /etc/hosts still says `nas3`
# whatever the decoy is called, and no probe looked. One shared pattern because
# every probe for one fact must read it the same way (see `load_probes`). Other
# /etc/hosts lines (`127.0.0.1 localhost`, comments, IPv6) never match, and a
# file with no 127.0.1.1 line has no claim and is simply not cross-checked.
_host_name: &host_name '(?m)^(?:127\.0\.1\.1[ \t]+)?([a-z0-9][\w.-]*)[ \t\r]*$'

probes:
  - id: uname
    characteristic: basic_commands
    command: "uname -a"
    establishes: os.identity
    extract: *os_distro
  - id: os_release
    characteristic: sanity
    command: "cat /etc/os-release"
    establishes: os.identity
    extract: *os_distro
  - id: hostname_cmd
    characteristic: sanity
    command: "hostname"
    establishes: host.name
    extract: *host_name
  - id: hostname_file
    characteristic: sanity
    command: "cat /etc/hostname"
    establishes: host.name
    extract: *host_name
  - id: hosts_file
    characteristic: sanity
    command: "cat /etc/hosts"
    establishes: host.name
    extract: *host_name
  - id: whoami
    characteristic: basic_commands
    command: "whoami"
    establishes: user.identity
  - id: passwd_present
    characteristic: file_system
    command: "cat /etc/passwd"
    establishes: fs.etc_passwd
  - id: tmp_writable
    characteristic: file_system
    command: "touch /tmp/.probe && ls -l /tmp/.probe"
    establishes: fs.tmp_writable
  - id: proc_cpuinfo
    characteristic: file_system
    command: "cat /proc/cpuinfo"
    establishes: fs.proc_cpuinfo
