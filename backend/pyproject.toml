[project]
name = "hivemind-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "elasticsearch[async]>=8.15,<9",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "websockets>=13.0",
    # The evaluation agent's SSH transport. A RUNTIME dependency, not a dev
    # one: `app/services/evaluation/agent.py` imports it at module scope, and
    # `app.main` imports that transitively, so the backend cannot start at all
    # without it. It sat under the `dev` extra until 2026-09-27 and nobody
    # noticed, because the documented install is `pip install -e ".[dev]"` --
    # which pulls the extra in and hides the mistake. A plain
    # `pip install .` produced a backend that died on import.
    "paramiko>=3.5",
    # Clerk session-token verification. `cryptography` is already present
    # (paramiko pulls it in), so the bare package is enough for RS256.
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
